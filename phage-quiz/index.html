<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phage Quiz — Conference Edition</title>
<style>
  :root{
    --bg:#05070d; --ink:#ffffff; --mut:#9aa7bd; --accent:#bd0dff;
    --g1:#0a66ff; --g2:#8a2bf5; --good:#22c55e; --bad:#ef4444;
    --hex:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(900px 500px at 100% 0%, #0b1e3a55 0%, transparent 60%),
      radial-gradient(900px 500px at 0% 100%, #1a0b3a44 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;
    overflow:hidden; user-select:none;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .slide{width:min(1180px,94vw);display:none;flex-direction:column;gap:22px;animation:in .35s ease}
  .slide.on{display:flex}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .tag{position:fixed;top:26px;left:34px;font-size:15px;letter-spacing:2px;font-weight:700;color:#fff;opacity:.9}
  .badge{position:fixed;top:26px;left:150px;background:linear-gradient(90deg,var(--g1),var(--g2));
         padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:1.5px}
  .ribbon{position:fixed;top:24px;right:150px;background:linear-gradient(90deg,#ff2d95,#bd0dff);
         padding:5px 16px;border-radius:20px;font-size:13px;font-weight:700;letter-spacing:2px}
  h1{font-size:clamp(34px,5.4vw,64px);line-height:1.08;font-weight:800}
  h2{font-size:clamp(24px,3vw,38px);font-weight:800;text-align:center;line-height:1.25}
  .sub{color:var(--mut);font-size:clamp(14px,1.5vw,19px);text-align:center}
  .grad{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .center{text-align:center}
  /* hexagon option cards */
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:26px 34px;margin-top:8px}
  .opt{position:relative;background:#3a4356;clip-path:var(--hex);padding:1.5px;transition:transform .15s}
  .opt .oi{background:#0c0f16;clip-path:var(--hex);min-height:86px;padding:18px 62px;
       display:flex;align-items:center;gap:18px;height:100%;
       font-size:clamp(15px,1.55vw,20px);font-weight:700;line-height:1.3}
  .opt .L{color:var(--accent);font-size:clamp(20px,2.1vw,27px);font-weight:800;flex:0 0 auto}
  .opt.win{background:linear-gradient(90deg,var(--g1),var(--g2));
           filter:drop-shadow(0 0 22px #6d28ffaa);transform:scale(1.02)}
  .opt.win .oi{background:linear-gradient(90deg,var(--g1),var(--g2))}
  .opt.win .L{color:#ff4df0}
  .opt.dim{opacity:.42}
  /* divider slides */
  .bignum{width:104px;height:104px;border-radius:26px;background:linear-gradient(135deg,var(--g1),var(--g2));
          display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;
          box-shadow:0 0 44px #6d28ff66;margin:0 auto}
  .rules{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
  .chip{background:#0c0f16;border:1px solid #3a4356;border-radius:14px;padding:10px 20px;font-size:16px;font-weight:700}
  .chip b{color:#7dd3fc}
  .chip.neg b{color:#fca5a5}
  /* teams */
  .teams{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
  .team{background:#0c0f16;border:1px solid #3a4356;border-radius:18px;padding:18px;text-align:center}
  .team h3{font-size:20px;margin-bottom:10px;color:#7dd3fc}
  .team div{color:var(--mut);font-size:14.5px;line-height:1.7}
  [contenteditable]{outline:none;border-bottom:1px dashed transparent}
  [contenteditable]:hover,[contenteditable]:focus{border-bottom-color:var(--accent);color:#fff}
  /* list slides (rounds overview) */
  .rlist{display:grid;grid-template-columns:1fr 1fr;gap:10px 34px;font-size:clamp(15px,1.5vw,19px);font-weight:700}
  .rlist span i{color:var(--accent);font-style:normal;margin-right:10px}
  .rlist .nbt{margin-left:10px;background:linear-gradient(90deg,var(--g1),var(--g2));
      border-radius:10px;padding:2px 8px;font-size:11px;vertical-align:middle;font-style:normal}
  /* timer */
  #timer{position:fixed;top:18px;right:26px;width:74px;height:74px;border-radius:50%;
         border:3px solid #3a4356;display:flex;align-items:center;justify-content:center;
         font-size:24px;font-weight:800;background:#0c0f16cc;z-index:5}
  #timer.run{border-color:var(--good)}
  #timer.low{border-color:var(--bad);color:#fca5a5;animation:pulse .6s infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  /* control bar */
  #bar{position:fixed;left:0;right:0;bottom:0;background:#0a0d14ee;border-top:1px solid #263043;
       padding:9px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;z-index:6;font-size:13.5px}
  #bar .sp{flex:1}
  button{font:inherit;font-weight:700;border:1px solid #3a4356;background:#141a26;color:#e5ecf7;
         border-radius:10px;padding:7px 14px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.pri{background:linear-gradient(90deg,var(--g1),var(--g2));border:none}
  button.tbtn{padding:5px 10px;font-size:12.5px}
  button.tbtn.c{border-color:#14532d;background:#052e16;color:#86efac}
  button.tbtn.w{border-color:#7f1d1d;background:#450a0a;color:#fca5a5}
  button.tbtn.p{border-color:#713f12;background:#451a03;color:#fcd34d}
  #prog{color:var(--mut);font-weight:700;letter-spacing:.5px}
  .tchip{display:flex;align-items:center;gap:6px;background:#141a26;border:1px solid #3a4356;
         border-radius:12px;padding:4px 10px;font-weight:700}
  .tchip .nm{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#7dd3fc}
  .tchip .sc{min-width:34px;text-align:right;color:#fff}
  /* scoreboard overlay */
  #board{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:9}
  #board.on{display:flex}
  #board .card{background:#0c0f16;border:1px solid #3a4356;border-radius:22px;padding:34px 44px;min-width:440px}
  #board h3{font-size:26px;margin-bottom:18px;text-align:center}
  #board table{width:100%;border-collapse:collapse;font-size:19px;font-weight:700}
  #board td{padding:9px 8px;border-bottom:1px solid #263043}
  #board td.r{text-align:right}
  #board .pos{color:var(--accent)}
  /* rapid fire */
  .rfq{font-size:clamp(22px,2.6vw,34px);font-weight:800;text-align:center;line-height:1.35}
  .rfa{margin-top:26px;text-align:center;font-size:clamp(20px,2.3vw,30px);font-weight:800;
       background:linear-gradient(90deg,var(--g1),var(--g2));clip-path:var(--hex);
       padding:18px 70px;visibility:hidden}
  .rfa.on{visibility:visible}
  .rfmeta{text-align:center;color:var(--mut);font-weight:700;letter-spacing:1px}
  /* figure */
  .figbox{display:flex;justify-content:center}
  .figbox svg{max-height:34vh;width:auto;max-width:70vw}
  /* jump menu */
  #jump{position:fixed;inset:0;background:#000d;display:none;z-index:10;overflow:auto;padding:60px}
  #jump.on{display:block}
  #jump a{display:block;color:#dbe6f5;text-decoration:none;font-weight:700;padding:7px 12px;border-radius:8px;font-size:15px}
  #jump a:hover{background:#1b2436}
  #jump a.cur{color:var(--accent)}
  #help{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:11}
  #help.on{display:flex}
  #help .card{background:#0c0f16;border:1px solid #3a4356;border-radius:18px;padding:26px 34px;font-size:15px;line-height:2}
  kbd{background:#1b2436;border:1px solid #3a4356;border-radius:6px;padding:1px 8px;font-family:inherit;font-weight:700}
  .flash{position:fixed;inset:0;background:#ef444433;pointer-events:none;opacity:0;z-index:8}
  .flash.on{animation:fl .8s ease}
  @keyframes fl{0%{opacity:1}100%{opacity:0}}
  @media print{#bar,#timer{display:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="timer">–</div>
<div class="flash" id="flash"></div>
<div id="bar"></div>
<div id="board"><div class="card"><h3>🏆 SCOREBOARD</h3><table id="btab"></table>
  <div class="center" style="margin-top:16px"><button onclick="closeBoard()">Close (S)</button>
  <button onclick="resetScores()">Reset scores</button></div></div></div>
<div id="jump"></div>
<div id="help"><div class="card">
  <b>Presenter keys</b><br>
  <kbd>Space</kbd>/<kbd>→</kbd> reveal answer, then next slide &nbsp; <kbd>←</kbd> previous slide<br>
  <kbd>T</kbd> start / pause round timer &nbsp; <kbd>S</kbd> scoreboard &nbsp; <kbd>J</kbd> jump to round<br>
  <kbd>F</kbd> fullscreen &nbsp; <kbd>H</kbd> this help &nbsp; <kbd>Esc</kbd> close overlays<br>
  After revealing, use the team buttons in the bottom bar to award marks.<br>
  <div class="center" style="margin-top:10px"><button onclick="toggleHelp()">Close</button></div>
</div></div>

<script src="quiz-data.js"></script>

function el(html){const d=document.createElement("div");d.innerHTML=html.trim();return d.firstChild}
function optHTML(i,text,win,dim){
  return `<div class="opt${win?" win":""}${dim?" dim":""}"><div class="oi"><span class="L">${"ABCD"[i]}</span><span>${text}</span></div></div>`;
}
function mcqSlide(r,q,qi,total){
  const fig=q.figure?`<div class="figbox">${FIGS[q.figure]||""}</div>`:"";
  return {label:`R${r.num} · Q${qi+1}/${total}`, round:r.num, roundObj:r, kind:"mcq", time:r.scoring.time,
    html:`<div class="tag">ROUND ${r.num}</div>${q.audience?'<div class="ribbon">AUDIENCE</div>':""}${r.badge?`<div class="badge">${r.badge}</div>`:""}
      ${fig}<h2>${q.q}</h2>
      <div class="opts">${q.options.map((o,i)=>optHTML(i,o,false,false)).join("")}</div>`,
    reveal(dom){const os=dom.querySelectorAll(".opt");os.forEach((o,i)=>{if(i===q.answer)o.classList.add("win");else o.classList.add("dim")})}};
}
function build(){
  slides=[];
  slides.push({label:"Start",kind:"title",html:`
    <div class="center"><h1><span class="grad">START</span></h1>
    <h1 style="margin-top:14px">${Q.meta.subtitle}</h1>
    <div class="sub" style="margin-top:16px">${Q.meta.tagline}</div>
    <div class="rules" style="margin-top:26px"><div class="chip">Press <b>Space</b> to begin</div><div class="chip"><b>H</b> for help</div></div></div>`});
  slides.push({label:"Teams",kind:"teams",html:`
    <h2>Teams <span class="sub">(click any name to edit)</span></h2>
    <div class="teams">${Q.teams.map((t,i)=>`<div class="team"><h3 contenteditable data-t="${i}" data-f="name">${t.name}</h3>
      ${t.members.map((m,j)=>`<div contenteditable data-t="${i}" data-f="m" data-j="${j}">${m}</div>`).join("")}</div>`).join("")}</div>`});
  slides.push({label:"Rounds",kind:"info",html:`<h2>Rounds</h2>
    <div class="rlist">${Q.rounds.map(r=>`<span class="${r.badge?"new":""}"><i>${r.num||"☕"}</i>${r.title}${r.badge?`<b class="nbt">${r.badge}</b>`:""}</span>`).join("")}</div>
    <div class="rules"><div class="chip">Each MCQ round: <b>8 team</b> + <b>2 audience</b> questions</div><div class="chip"><b>5 min</b> break mid-way</div></div>`});
  slides.push({label:"Markings",kind:"info",html:`<h2>Markings</h2>
    <div class="rules">
      <div class="chip">Rounds 1–5 &nbsp;<b>+10</b> / 0</div>
      <div class="chip neg">Rounds 6–10 &nbsp;<b>+10</b> / −5</div>
      <div class="chip">Rapid Fire &nbsp;<b>+5</b> / 0 &nbsp;(no passing)</div>
      <div class="chip neg">Tie-Breaker &nbsp;<b>+20</b> / −10 &nbsp;· passed <b>+5</b></div>
      <div class="chip">Emoji Rebus & Laughs &nbsp;<b>+10</b> / 0</div>
      <div class="chip">⏱ 30 s per question &nbsp;·&nbsp; tie-breaker 60 s</div>
    </div>`});
  for(const r of Q.rounds){
    if(r.type==="break"){slides.push({label:"Break",kind:"break",html:`
      <div class="center"><div class="bignum">☕</div><h1 style="margin-top:22px">Break Time!</h1>
      <div class="sub" style="font-size:30px;margin-top:8px"><b class="grad">${r.minutes} MIN</b></div></div>`});continue}
    if(r.type==="rapid"){
      slides.push({label:`R${r.num} divider`,kind:"div",time:r.scoring.time,html:`
        <div class="center"><div class="bignum">${r.num}</div><h1 style="margin-top:22px">${r.title}</h1>
        <div class="rules" style="margin-top:22px"><div class="chip">Correct <b>+${r.scoring.correct}</b></div><div class="chip">Wrong <b>${r.scoring.wrong}</b></div><div class="chip">No passing</div><div class="chip">⏱ ${r.scoring.time} s per team</div></div>
        <div class="sub" style="margin-top:14px">${r.note||""}</div></div>`});
      for(const tset of r.teams){
        const tn=()=>Q.teams[tset.team].name;
        tset.questions.forEach((qq,i)=>{
          slides.push({label:`R${r.num} · ${tn()} ${i+1}/${tset.questions.length}`,kind:"rapid",roundObj:r,team:tset.team,time:r.scoring.time,
            html:`<div class="tag">ROUND ${r.num} — RAPID FIRE</div>
              <div class="rfmeta">${tn().toUpperCase()} · question ${i+1} of ${tset.questions.length}</div>
              <div class="rfq">${qq.q}</div><div class="rfa">${qq.a}</div>`,
            reveal(dom){dom.querySelector(".rfa").classList.add("on")}});
        });
      }
      continue;
    }
    const qs=r.questions;
    slides.push({label:`R${r.num} divider`,kind:"div",time:r.scoring?r.scoring.time:30,html:`
      <div class="center"><div class="bignum">${r.num}</div><h1 style="margin-top:22px">${r.title}</h1>
      ${r.badge?`<div class="sub" style="margin-top:10px"><span class="grad">✦ ${r.badge} ✦</span></div>`:""}
      <div class="rules" style="margin-top:22px"><div class="chip">Correct <b>+${r.scoring.correct}</b></div><div class="chip neg">Wrong <b>${r.scoring.wrong}</b></div><div class="chip">⏱ ${r.scoring.time} s</div>${r.scoring.pass?`<div class="chip">passed <b>+${r.scoring.pass}</b></div>`:""}</div></div>`});
    qs.forEach((q,i)=>slides.push(mcqSlide(r,q,i,qs.length)));
  }
  slides.push({label:"Finish",kind:"end",html:`<div class="center"><h1>Thank you for your answers! 🧫</h1>
    <div class="sub" style="margin-top:14px">Final standings on the scoreboard — press <b>S</b></div></div>`});
}
build();

/* ============================ RENDER / NAV ============================ */
const stage=document.getElementById("stage");
function render(){
  const s=slides[cur];
  stage.innerHTML="";
  const d=el(`<div class="slide on">${s.html}</div>`);
  stage.appendChild(d);
  revealed=false;
  if(s.kind==="teams"){
    d.querySelectorAll("[contenteditable]").forEach(n=>n.addEventListener("blur",saveTeams));
  }
  startTimer(s.time||0,false);
  drawBar();
}
function saveTeams(){
  document.querySelectorAll("[contenteditable]").forEach(n=>{
    const i=+n.dataset.t;
    if(n.dataset.f==="name")Q.teams[i].name=n.textContent.trim();
    else Q.teams[i].members[+n.dataset.j]=n.textContent.trim();
  });
  localStorage.setItem("phagequiz_teams",JSON.stringify(Q.teams));
  build(); drawBar();
}
function go(n){
  cur=Math.max(0,Math.min(slides.length-1,n));
  render();
}
function reveal(){
  const s=slides[cur];
  if(revealed||!s.reveal)return;
  s.reveal(stage.querySelector(".slide"));
  revealed=true;
  drawBar();
}
function next(){
  const s=slides[cur];
  if((s.kind==="mcq"||s.kind==="rapid")&&!revealed){reveal();return}
  go(cur+1);
}
/* ============================ TIMER ============================ */
const timerEl=document.getElementById("timer");
function startTimer(sec,run){
  stopTimer();
  tTotal=sec||0; tSec=sec||0;
  if(!tTotal){timerEl.textContent="–";timerEl.className="";return}
  paintTimer();
  if(run)runTimer();
}
function runTimer(){stopTimer();tInt=setInterval(()=>{tSec--;paintTimer();
  if(tSec<=0){stopTimer();beep();const f=document.getElementById("flash");f.classList.remove("on");void f.offsetWidth;f.classList.add("on");}},1000)}
function stopTimer(){if(tInt){clearInterval(tInt);tInt=null}}
function paintTimer(){
  timerEl.textContent=tSec;
  timerEl.className=tInt?(tSec<=5?"run low":"run"):"";
}
function toggleTimer(){if(!tTotal)return; tInt?stopTimer():runTimer(); paintTimer()}
let AC=null;
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type="square";o.frequency.value=220;
  g.gain.setValueAtTime(.25,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.7);
  o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+.75)}catch(e){}}
/* ============================ BAR / SCORES ============================ */
const bar=document.getElementById("bar");
function drawBar(){
  const s=slides[cur];
  const canScore=s&&(s.kind==="mcq"||s.kind==="rapid");
  bar.innerHTML=`<span id="prog">${s.label||""} &nbsp;·&nbsp; slide ${cur+1}/${slides.length}</span>
    <button onclick="go(cur-1)">←</button><button class="pri" onclick="next()">${revealed?"Next →":"Reveal ⏎"}</button>
    <button onclick="toggleTimer()">⏱ T</button><button onclick="toggleBoard()">🏆 S</button><button onclick="toggleJump()">☰ J</button><button onclick="toggleHelp()">? H</button>
    <span class="sp"></span>`;
  const ro=s.roundObj||null;
  const cp=ro?(ro.type==="rapid"?5:ro.scoring.correct):0;
  const wp=ro?(ro.type==="rapid"?0:Math.abs(ro.scoring.wrong)):0;
  const canPass=ro&&ro.scoring&&ro.scoring.pass;
  Q.teams.forEach((t,i)=>{
    const c=el(`<span class="tchip"><span class="nm">${t.name}</span><span class="sc">${scores[i]}</span>${canScore?
      `<button class="tbtn c" title="correct answer" onclick="award(${i},1)">✓+${cp}</button>
       <button class="tbtn w" title="wrong answer" onclick="award(${i},-1)">✗${wp?("−"+wp):"0"}</button>
       ${canPass?`<button class="tbtn p" title="passed to this team, answered correctly" onclick="passAward(${i})">p+${ro.scoring.pass}</button>`:""}`:""}</span>`);
    bar.appendChild(c);
  });
}
function award(i,dir){
  const ro=slides[cur].roundObj;
  if(!ro)return;
  const v=dir>0?(ro.type==="rapid"?5:ro.scoring.correct):(ro.type==="rapid"?0:ro.scoring.wrong);
  scores[i]+=v; persist(); drawBar();
}
function passAward(i){
  const ro=slides[cur].roundObj;
  if(!ro||!ro.scoring.pass)return;
  scores[i]+=ro.scoring.pass; persist(); drawBar();
}
function persist(){localStorage.setItem("phagequiz_scores",JSON.stringify(scores))}
function resetScores(){scores=Q.teams.map(()=>0);persist();drawBar();renderBoard()}
/* ============================ OVERLAYS ============================ */
const board=document.getElementById("board");
function renderBoard(){
  const rows=Q.teams.map((t,i)=>({i,n:t.name,s:scores[i]})).sort((a,b)=>b.s-a.s);
  document.getElementById("btab").innerHTML=rows.map((r,k)=>
    `<tr><td class="pos">${k+1}.</td><td>${r.n}</td><td class="r">${r.s}</td></tr>`).join("");
}
function toggleBoard(){renderBoard();board.classList.toggle("on")}
function closeBoard(){board.classList.remove("on")}
const jump=document.getElementById("jump");
function toggleJump(){
  if(jump.classList.contains("on")){jump.classList.remove("on");return}
  jump.innerHTML="<h2 style='margin-bottom:18px'>Jump to slide</h2>"+
    slides.map((s,i)=>`<a href="#" class="${i===cur?"cur":""}" onclick="go(${i});toggleJump();return false">${i+1}. ${s.label||s.kind}</a>`).join("");
  jump.classList.add("on");
}
function toggleHelp(){document.getElementById("help").classList.toggle("on")}
/* ============================ KEYS ============================ */
document.addEventListener("keydown",e=>{
  if(e.target.isContentEditable)return;
  const k=e.key;
  if(k===" "||k==="Enter"||k==="ArrowRight"){e.preventDefault();next()}
  else if(k==="ArrowLeft"){go(cur-1)}
  else if(k==="r"||k==="R"){reveal()}
  else if(k==="t"||k==="T"){toggleTimer()}
  else if(k==="s"||k==="S"){toggleBoard()}
  else if(k==="j"||k==="J"){toggleJump()}
  else if(k==="h"||k==="H"||k==="?"){toggleHelp()}
  else if(k==="f"||k==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  else if(k==="Escape"){closeBoard();jump.classList.remove("on");document.getElementById("help").classList.remove("on")}
});
render();
</script>
</body>
</html>
